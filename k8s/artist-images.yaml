apiVersion: v1
kind: ConfigMap
metadata:
  name: artist-images-config
  namespace: webapps
data:
  LOG_REQUESTS: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artist-images
  namespace: webapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artist-images
  template:
    metadata:
      labels:
        app: artist-images
    spec:
      initContainers:
        - name: nfs-check
          image: busybox:latest
          command: ['sh', '-c', 'ls /media/music | grep -q . || (echo "NFS mount empty"; exit 1)']
          volumeMounts:
            - name: music
              mountPath: /media/music
      containers:
        - name: artist-images
          image: ghcr.io/xkogd66/artist-images:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: MUSIC_ROOT
              value: /media/music
            - name: LOG_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: artist-images-config
                  key: LOG_REQUESTS
          volumeMounts:
            - name: music
              mountPath: /media/music
      volumes:
        - name: music
          nfs:
            server: 192.168.1.8
            path: /var/lib/media/music/mp3
---
apiVersion: v1
kind: Service
metadata:
  name: artist-images
  namespace: webapps
spec:
  selector:
    app: artist-images
  ports:
    - port: 8080
      targetPort: 8080
