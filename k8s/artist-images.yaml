apiVersion: v1
kind: ConfigMap
metadata:
  name: artist-images-config
  namespace: webapps
data:
  LOG_REQUESTS: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artist-images
  namespace: webapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artist-images
  template:
    metadata:
      labels:
        app: artist-images
    spec:
      initContainers:
        - name: nfs-check
          image: busybox:latest
          command: ['sh', '-c', 'ls /media/music | grep -q . || (echo "NFS mount empty"; exit 1)']
          volumeMounts:
            - name: music
              mountPath: /media/music
      containers:
        - name: artist-images
          image: ghcr.io/xkogd66/artist-images:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: MUSIC_ROOT
              value: /media/music
            - name: LOG_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: artist-images-config
                  key: LOG_REQUESTS
          volumeMounts:
            - name: music
              mountPath: /media/music
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: artist-images-music
---
# NFS 4.1, not 4.2: on 4.2 Go's file-to-file copy (id3v2 Save) becomes an async
# server-side COPY that hangs in handle_async_copy. An inline nfs volume can't
# set mount options, hence the PV/PVC.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: artist-images-music
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 192.168.1.8
    path: /var/lib/media/music/mp3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artist-images-music
  namespace: webapps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: artist-images-music
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: Service
metadata:
  name: artist-images
  namespace: webapps
spec:
  selector:
    app: artist-images
  ports:
    - port: 8080
      targetPort: 8080
