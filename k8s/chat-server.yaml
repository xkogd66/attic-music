apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-server
  namespace: webapps
spec:
  replicas: 1
  # ReadWriteOnce volume (ratings.json): the old pod must release it before the
  # new one starts, so no rolling update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chat-server
  template:
    metadata:
      labels:
        app: chat-server
    spec:
      containers:
        - name: chat-server
          image: ghcr.io/xkogd66/chat-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          volumeMounts:
            - name: data
              mountPath: /data
          env:
            # Discogs personal access token — enables the discogs_rating tool and
            # POST /ratings. Without it, stored ratings are still served.
            - name: DISCOGS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chat-server-secret
                  key: DISCOGS_TOKEN
                  optional: true
            # ── LLM provider ───────────────────────────────────────────────
            # Single provider: DeepSeek only. With one entry the /providers
            # list has length 1, so the frontend never renders a picker and
            # every request falls back to this default provider.
            - name: LLM_PROVIDERS
              value: |
                [
                  { "id": "deepseek", "label": "DeepSeek", "kind": "openai", "model": "deepseek-v4-flash",
                    "baseUrl": "https://api.deepseek.com/v1", "apiKeyEnv": "DEEPSEEK_API_KEY" }
                ]
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chat-server-secret
                  key: DEEPSEEK_API_KEY
            - name: GONIC_URL
              valueFrom:
                secretKeyRef:
                  name: chat-server-secret
                  key: GONIC_URL
            - name: GONIC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: chat-server-secret
                  key: GONIC_USERNAME
            - name: GONIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-server-secret
                  key: GONIC_PASSWORD
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chat-server-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chat-server-data
  namespace: webapps
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-server
  namespace: webapps
spec:
  selector:
    app: chat-server
  ports:
    - port: 8090
      targetPort: 8090
