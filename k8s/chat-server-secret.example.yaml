# Template for chat-server-secret. attic-music is a PUBLIC repo — never commit
# a filled-in copy of this file.
#
#   cp k8s/chat-server-secret.example.yaml k8s/chat-server-secret.yaml
#   $EDITOR k8s/chat-server-secret.yaml
#   kubectl apply -f k8s/chat-server-secret.yaml
#
# stringData takes plain values — kubernetes base64-encodes them on apply, so
# there is nothing to encode by hand.
#
# Every key below must be present and non-empty for the providers listed in
# LLM_PROVIDERS in chat-server.yaml. The server exits at startup if a listed
# provider's key is missing, so drop a provider from LLM_PROVIDERS rather than
# leaving its key blank here.
apiVersion: v1
kind: Secret
metadata:
  name: chat-server-secret
  namespace: webapps
type: Opaque
stringData:
  # gonic backend — the same instance the frontend uses
  GONIC_URL: https://gonic.ekskog.net
  GONIC_USERNAME: REPLACE_ME
  GONIC_PASSWORD: REPLACE_ME

  # provider keys — one per entry in LLM_PROVIDERS
  ANTHROPIC_API_KEY: REPLACE_ME
  GEMINI_API_KEY: REPLACE_ME
  DEEPSEEK_API_KEY: REPLACE_ME
  # Ollama needs no real credential, but the var must exist and be non-empty
  OLLAMA_API_KEY: unused
