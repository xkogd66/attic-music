server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or deploys stay invisible until a hard
    # refresh (the hashed JS/CSS under /assets are safe to cache forever).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /artist-images/ {
        proxy_pass http://artist-images:8080/;
    }

    location /deezer-api/ {
        proxy_pass https://api.deezer.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.deezer.com;
    }

    location /chat-api/ {
        proxy_pass http://chat-server:8090/;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}