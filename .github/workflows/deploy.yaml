name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-attic-music:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          cat > public/config.json <<EOF
          {
            "server": "https://gonic.ekskog.net",
            "username": "lucarv",
            "lastfmUser": "katstoopid",
            "lastfmKey": "$LASTFM_API_KEY",
            "turnstileSiteKey": "$TURNSTILE_SITE_KEY"
          }
          EOF

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Rollout restart
        run: |
          kubectl rollout restart deployment/attic-music -n webapps
          kubectl rollout status deployment/attic-music -n webapps --timeout=120s

  build-artist-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes in artist-images/
        id: changes
        run: |
          git diff --name-only HEAD~1 HEAD | grep -q '^artist-images/' && echo "changed=true" >> $GITHUB_OUTPUT || echo "changed=false" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        if: steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push artist-images
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: artist-images
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/artist-images:latest
            ghcr.io/${{ github.repository_owner }}/artist-images:${{ github.sha }}

      - name: Set up kubectl
        if: steps.changes.outputs.changed == 'true'
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply and rollout
        if: steps.changes.outputs.changed == 'true'
        run: |
          kubectl apply -f k8s/artist-images.yaml
          kubectl rollout restart deployment/artist-images -n webapps
          kubectl rollout status deployment/artist-images -n webapps --timeout=120s
